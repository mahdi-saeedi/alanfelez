# Staging - auto-deployed from main. CI (release workflow) rewrites images.*.tag on every merge.
global:
  env: staging
  hosts:
    web: staging.alanfelez.ir
    api: api.staging.alanfelez.ir
    auth: auth.staging.alanfelez.ir
    admin: admin.staging.alanfelez.ir
  imageRegistry: registry-b73b5f9c02-alanfelez.apps.ir-central1.arvancaas.ir/alanfelez # ArvanCloud Container Registry host, see docs/guides/DEPLOYMENT.md §3
  imagePullSecrets: [] # the node itself logs in to the registry (/etc/rancher/k3s/registries.yaml)
images:
  api: {repository: api, tag: "sha-6a65a350e689"}
  web: {repository: web, tag: "sha-6a65a350e689"}
  keycloak: {repository: keycloak, tag: "sha-6a65a350e689"}
  admin: {repository: admin, tag: "sha-6a65a350e689"}
api:
  replicas: 1 # small staging server (2 CPU / 4 GB)
  seedProfiles: reference,demo
  demoPrices: false # off since 2026-10-23: staff enter prices by hand to try the price admin (the demo history stays)
  paymentGateway: mock # fake gateway page, no real money
  smsProvider: console # SMS written to the worker log
keycloak:
  # Sign-in codes go out by real SMS through sms.ir (line 500037506946788; key in secrets/alanfelez-sms, restricted to the
  # servers' IPs). Template 972517 is the client's approved verify template with parameter CODE.
  otp: {smsProvider: smsir, consoleAllowed: false, smsir: {templateId: "972517"}}
web:
  replicas: 1 # small staging server (2 CPU / 4 GB)
ingress:
  basicAuth: {enabled: false} # no shared password: anyone with the address can open staging (pages stay noindex)

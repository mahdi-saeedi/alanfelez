# Production - deployed from release tags through a reviewed PR (release workflow).
global:
  env: production
  hosts:
    web: alanfelez.ir
    api: api.alanfelez.ir
    auth: auth.alanfelez.ir
  imageRegistry: registry-808c2160fb-alanfelez.apps.ir-central1.arvancaas.ir/alanfelez
  imagePullSecrets: [{ name: arvan-registry }]
images:
  api: { repository: api, tag: "0.0.0" }
  web: { repository: web, tag: "0.0.0" }
  keycloak: { repository: keycloak, tag: "0.0.0" }
  admin: { repository: admin, tag: "0.0.0" }
api:
  replicas: 2
  seedProfiles: reference
web:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, cpuPercent: 70 }
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { memory: 768Mi }
  indexable: true
  cspFormOrigins: []   # add the real gateway's payment page origin with F13, e.g. https://www.zarinpal.com
keycloak:
  replicas: 2
  otp: { smsProvider: console, consoleAllowed: false }   # a real provider must be configured before launch (F7)

# Until launch these match the data already on the production server (one instance, 10 GiB, local-path storage,
# which can't grow in place). Before launch (LAUNCH.md §2): the Object Storage bucket + alanfelez-backup-s3 secret,
# then backup.enabled true; a second instance and more storage need a planned migration.
postgres:
  instances: 1
  storage: { size: 10Gi }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  backup:
    enabled: false                 # until the bucket exists: archiving with nowhere to send WAL fills the disk
    destinationPath: s3://alanfelez-backups/production/postgres
    endpointURL: https://s3.ir-thr-at1.arvanstorage.ir

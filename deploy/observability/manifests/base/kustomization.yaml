# Monitoring objects shared by staging and production (overlays/<env> add the sealed secrets and the Bale chat id).
# Argo CD app: deploy/argocd/envs/<env>/34-observability.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - monitors.yaml
  - rules.yaml
  - alerting.yaml
# Dashboards: one JSON file each (export from Grafana: Share → Export → "Export for sharing externally" off).
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard into the folder named by grafana_folder.
configMapGenerator:
  - name: dashboard-alanfelez-overview
    namespace: monitoring
    files: [dashboards/alanfelez-overview.json]
    options:
      labels: { grafana_dashboard: "1" }
      annotations: { grafana_folder: Alan Felez }
generatorOptions:
  disableNameSuffixHash: true

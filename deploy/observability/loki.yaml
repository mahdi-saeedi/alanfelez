# Loki (deploy/vendor/charts) for production (staging has none): every pod's logs, collected by Alloy (alloy.yaml), searched in
# Grafana (Explore → Loki). One process with its index and chunks on the node's disk; retention per environment in the
# Argo CD app (deploy/argocd/envs/<env>/31-loki.yaml). The apps already log JSON with request_id (no personal data).
fullnameOverride: loki
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 720h            # 30 days; per environment in the Argo CD app
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_lookback: 720h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester: { enabled: true } # "Patterns" in Grafana's log explorer groups similar lines

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }

# Not needed for one small instance.
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
sidecar: { rules: { enabled: false } }

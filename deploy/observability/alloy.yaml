# Grafana Alloy (deploy/vendor/charts) for production (staging has none): sends every pod's logs and the cluster's events
# (image pull failures, crashes, failed probes — kept 30 days instead of Kubernetes' 1 hour) to Loki. Reads through
# the Kubernetes API, so it needs no host mounts. Labels: namespace, app, pod, container, level, env.
fullnameOverride: alloy
controller: { type: deployment, replicas: 1 }

alloy:
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 384Mi }
  clustering: { enabled: false }
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_container_name"]
          regex         = "^;*([^;]+).*$"
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      // The Go API and worker log JSON (slog): lift the level (INFO, WARN, ERROR) into a label, keep the line as it is.
      loki.process "pods" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.source.kubernetes_events "events" {
        job_name   = "kubernetes-events"
        log_format = "json"
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring:3100/loki/api/v1/push"
        }
        external_labels = { env = sys.env("ENV") }
      }
  extraEnv:
    - { name: ENV, value: production }   # per environment in the Argo CD app

# The mirror copies one platform, which changes the digest; pin by tag so pulls come from the ArvanCloud mirror.
configReloader:
  image: { tag: v0.94.2 }

rbac: { create: true }

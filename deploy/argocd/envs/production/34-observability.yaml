# Generated layout: see deploy/argocd/README.md
# Monitoring: alert rules, what to scrape, where alerts go (Bale) and the dashboards (deploy/observability/manifests).
# Wave 12: after the charts that install the monitoring CRDs (retries until they exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    repoURL: ssh://git@188.121.120.201/home/git/alanfelez.git
    targetRevision: main
    path: deploy/observability/manifests/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }

# Generated layout: see deploy/argocd/README.md
# Monitoring (Loki: the logs). Shared values: deploy/observability/loki.yaml; below only what differs per environment.
# Wave 10: after the site, so nothing here can hold up a deploy of the app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    # Chart loki 7.5.0 (https://grafana.github.io/helm-charts), vendored (deploy/vendor/charts/README.md)
    repoURL: ssh://git@188.121.120.201/home/git/alanfelez.git
    targetRevision: main
    path: deploy/vendor/charts/loki
    helm:
      releaseName: loki
      valueFiles: [../../../observability/loki.yaml]
      valuesObject:
        loki:
          limits_config:
            retention_period: 720h
            max_query_lookback: 720h
        singleBinary:
          persistence: { size: 20Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

# Generated layout: see deploy/argocd/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alanfelez-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    repoURL: git@github.com:mahdi-saeedi/alanfelez.git
    targetRevision: main
    path: deploy/environments/staging/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: alanfelez
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

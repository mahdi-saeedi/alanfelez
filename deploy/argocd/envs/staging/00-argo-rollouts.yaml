# Generated layout: see deploy/argocd/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    # Chart argo-rollouts 2.43.2, vendored from https://argoproj.github.io/argo-helm (deploy/vendor/charts/README.md)
    repoURL: git@github.com:mahdi-saeedi/alanfelez.git
    targetRevision: main
    path: deploy/vendor/charts/argo-rollouts
    helm:
      valuesObject:
        installCRDs: true
        dashboard: { enabled: true }

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

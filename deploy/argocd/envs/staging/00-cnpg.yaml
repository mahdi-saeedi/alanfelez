# Generated layout: see deploy/argocd/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    # Chart cloudnative-pg 0.29.1, vendored from https://cloudnative-pg.github.io/charts (deploy/vendor/charts/README.md)
    repoURL: git@github.com:mahdi-saeedi/alanfelez.git
    targetRevision: main
    path: deploy/vendor/charts/cloudnative-pg
    helm:
      valuesObject:
        crds: { create: true }

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

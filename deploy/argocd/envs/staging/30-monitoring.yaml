# Generated layout: see deploy/argocd/README.md
# Monitoring (Prometheus, Alertmanager, Grafana at https://admin.staging.alanfelez.ir/grafana). Shared values: deploy/observability/kube-prometheus-stack.yaml; below only what differs per environment.
# Wave 10: after the site, so nothing here can hold up a deploy of the app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    # Chart kube-prometheus-stack 92.15.0 (https://prometheus-community.github.io/helm-charts), vendored (deploy/vendor/charts/README.md)
    repoURL: ssh://git@37.32.39.49/home/git/alanfelez.git
    targetRevision: main
    path: deploy/vendor/charts/kube-prometheus-stack
    helm:
      releaseName: kps
      valueFiles: [../../../observability/kube-prometheus-stack.yaml]
      valuesObject:
        prometheus:
          prometheusSpec:
            externalLabels: { env: staging }
            retention: 7d
            retentionSize: 2GB
            resources: { limits: { memory: 1Gi } }
            storageSpec:
              volumeClaimTemplate:
                spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
        grafana:
          ingress:
            hosts: [admin.staging.alanfelez.ir]
            tls: [{ hosts: [admin.staging.alanfelez.ir], secretName: kps-grafana-tls }]
          grafana.ini:
            server: { root_url: "https://admin.staging.alanfelez.ir/grafana" }
            auth.generic_oauth:
              auth_url: https://auth.staging.alanfelez.ir/realms/alanfelez/protocol/openid-connect/auth
              token_url: http://alanfelez-keycloak.alanfelez:8080/realms/alanfelez/protocol/openid-connect/token
              api_url: http://alanfelez-keycloak.alanfelez:8080/realms/alanfelez/protocol/openid-connect/userinfo
              signout_redirect_url: https://auth.staging.alanfelez.ir/realms/alanfelez/protocol/openid-connect/logout?client_id=alanfelez-grafana&post_logout_redirect_uri=https%3A%2F%2Fadmin.staging.alanfelez.ir%2Fgrafana%2Flogin
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }

# Root "app of apps" for production. Apply once after installing Argo CD:
#   kubectl apply -f deploy/argocd/projects/alanfelez.yaml -f deploy/argocd/roots/root-production.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-production
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    repoURL: https://github.com/alanfelez/alanfelez.git
    targetRevision: main
    path: deploy/argocd/envs/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }

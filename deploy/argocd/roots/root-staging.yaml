# Root "app of apps" for staging. Apply once after installing Argo CD:
#   kubectl apply -f deploy/argocd/projects/alanfelez.yaml -f deploy/argocd/roots/root-staging.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-staging
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: alanfelez
  source:
    repoURL: ssh://git@188.121.120.201/home/git/alanfelez.git
    targetRevision: main
    path: deploy/argocd/envs/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The first sync installs CRDs (cert-manager, CNPG) that later resources need: retry until they exist.
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }

# PostgreSQL managed by the CloudNativePG operator (ADR-0019). The operator creates the secret
# "{{ .Release.Name }}-pg-app" (username, password, host, uri, …) for the application database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  bootstrap:
    {{- with .Values.postgres.restoreFrom }}
    # A new cluster that starts from another cluster's backups (moving servers, REBUILD.md step 8). Read once, when the
    # cluster is created; later changes to restoreFrom do nothing. The restored cluster backs up to backup.destinationPath,
    # which must be a different folder than restoreFrom.destinationPath.
    recovery:
      source: origin
      # Without these CloudNativePG gives the app a login for a NEW empty database "app" (it did on 2026-11-08).
      database: {{ .database | default $.Values.postgres.appDatabase }}
      owner: {{ .owner | default $.Values.postgres.appDatabase }}
      {{- with .targetTime }}
      recoveryTarget: { targetTime: {{ . | quote }} }
      {{- end }}
    {{- else }}
    initdb:
      database: {{ $.Values.postgres.appDatabase }}
      owner: {{ $.Values.postgres.appDatabase }}
    {{- end }}
  {{- with .Values.postgres.restoreFrom }}
  {{- if eq .destinationPath $.Values.postgres.backup.destinationPath }}
  {{- fail "postgres.restoreFrom.destinationPath must differ from postgres.backup.destinationPath (two clusters must never write to one backup folder)" }}
  {{- end }}
  externalClusters:
    - name: origin
      barmanObjectStore:
        serverName: {{ .serverName }}
        destinationPath: {{ required "postgres.restoreFrom.destinationPath" .destinationPath }}
        endpointURL: {{ required "postgres.backup.endpointURL" $.Values.postgres.backup.endpointURL }}
        s3Credentials:
          accessKeyId: { name: {{ $.Values.postgres.backup.s3CredentialsSecret }}, key: ACCESS_KEY_ID }
          secretAccessKey: { name: {{ $.Values.postgres.backup.s3CredentialsSecret }}, key: ACCESS_SECRET_KEY }
        wal: { maxParallel: 4 }
  {{- end }}
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.postgres.keycloak.passwordSecret }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources: {{- toYaml .Values.postgres.resources | nindent 4 }}
  # The operator's own defaults, plus AppArmor off for this pod only. Ubuntu 26.04's AppArmor gives some Postgres
  # processes a stacked label (cri-containerd.apparmor.d//&unconfined) and then blocks signals between them, so
  # Postgres can't wake its checkpointer: "could not signal for checkpoint: Permission denied". That failed the
  # nightly backups (2026-11-06…08) and left production stuck in recovery after a restart (2026-11-07).
  # Setting podSecurityContext replaces the operator's default, so its other fields are repeated here.
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    fsGroup: 26
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
    appArmorProfile: { type: Unconfined }
  {{- if .Values.postgres.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy }}
    barmanObjectStore:
      destinationPath: {{ required "postgres.backup.destinationPath" .Values.postgres.backup.destinationPath }}
      endpointURL: {{ required "postgres.backup.endpointURL" .Values.postgres.backup.endpointURL }}
      s3Credentials:
        accessKeyId: { name: {{ .Values.postgres.backup.s3CredentialsSecret }}, key: ACCESS_KEY_ID }
        secretAccessKey: { name: {{ .Values.postgres.backup.s3CredentialsSecret }}, key: ACCESS_SECRET_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
  {{- end }}
---
# Separate database for Keycloak, owned by its own role (identity data isolated from app data).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Release.Name }}-keycloak-db
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  cluster: { name: {{ .Release.Name }}-pg }
  name: {{ .Values.postgres.keycloak.database }}
  owner: keycloak
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-pg-nightly
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  immediate: true            # also one backup as soon as backups are turned on, not only at the next night
  cluster: { name: {{ .Release.Name }}-pg }
  backupOwnerReference: self
{{- end }}
{{- if .Values.devSecrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.keycloak.passwordSecret }}
  labels:
    {{- include "data.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: {{ .Values.devSecrets.keycloakDbPassword | quote }}
{{- end }}

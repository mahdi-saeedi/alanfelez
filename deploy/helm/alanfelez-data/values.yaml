postgres:
  instances: 1                 # 2+ in production for HA
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage: { size: 10Gi, storageClass: "" }
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  appDatabase: alanfelez       # owner role: alanfelez, credentials in secret <release>-pg-app (generated by CNPG)
  keycloak:
    database: keycloak
    # Secret with keys username=keycloak, password=… (SealedSecret in staging/production, generated for local)
    passwordSecret: alanfelez-keycloak-db
  backup:
    enabled: false             # true in staging/production (Arvan Object Storage, WAL archiving = PITR)
    destinationPath: ""        # s3://alanfelez-backups/<env>/postgres
    endpointURL: ""            # https://s3.ir-thr-at1.arvanstorage.ir
    s3CredentialsSecret: alanfelez-backup-s3   # keys: ACCESS_KEY_ID, ACCESS_SECRET_KEY
    retentionPolicy: 30d
    schedule: "0 0 2 * * *"   # nightly full backup (seconds-precision cron)
  # Start a NEW cluster from another cluster's backups instead of empty (moving to a new server; REBUILD.md step 8).
  # Only read when the cluster is created. Example:
  #   restoreFrom: { destinationPath: s3://alanfelez-backups/production/postgres, serverName: alanfelez-data-pg }
  # Optional targetTime ("2026-11-08 22:00:00+00") restores to that moment instead of the latest.
  restoreFrom: {}

redis:
  enabled: true
  image: redis:8-alpine
  storage: { size: 1Gi, storageClass: "" }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Local clusters only: generate the Keycloak DB password secret here. Never in staging/production (use SealedSecrets).
devSecrets:
  enabled: false
  keycloakDbPassword: keycloak-local

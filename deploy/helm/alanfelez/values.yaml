# Defaults are production-safe. Environment files in deploy/environments/<env>/values.yaml override them.
global:
  env: production                  # APP_ENV of the API: local | staging | production
  scheme: https
  publicPort: ""                   # e.g. ":8088" for a local cluster; empty for 80/443
  hosts:
    web: alanfelez.ir
    api: api.alanfelez.ir
    auth: auth.alanfelez.ir
    admin: admin.alanfelez.ir
  imageRegistry: ""                # e.g. registry.arvancloud.ir/alanfelez (prefix for images below)
  imagePullSecrets: []

# Release name of the alanfelez-data chart in the same namespace (Postgres + Redis).
dataRelease: alanfelez-data

images:                            # tags are written by CI (GitOps). Never "latest" outside local.
  api: { repository: alanfelez/api, tag: "0.0.0", pullPolicy: IfNotPresent }
  web: { repository: alanfelez/web, tag: "0.0.0", pullPolicy: IfNotPresent }
  keycloak: { repository: alanfelez/keycloak, tag: "0.0.0", pullPolicy: IfNotPresent }
  admin: { repository: alanfelez/admin, tag: "0.0.0", pullPolicy: IfNotPresent }

# Secrets are never stored in this chart. Staging/production: SealedSecrets (deploy/environments/<env>/secrets).
secrets:
  app: alanfelez-app               # keys: AUTH_SECRET, KC_WEB_CLIENT_SECRET
  keycloakAdmin: alanfelez-keycloak-admin   # keys: username, password (bootstrap admin, first start only)
  keycloakDb: alanfelez-keycloak-db         # keys: username, password (also used by the data chart)
  sms: alanfelez-sms               # key: SMSIR_API_KEY (sms.ir). Optional: without it the smsir sender refuses to send
  keycloakApiAdmin: alanfelez-keycloak-api-admin  # key: client-secret. Optional: the API's Keycloak service account
                                   # (deleting users); the profile job creates the client with this secret

api:
  replicas: 2
  logLevel: info
  seedProfiles: reference          # "reference,demo" on staging; demo is refused in production
  demoPrices: false                # demo price generator (with the demo seed). Refused in production
  paymentGateway: none             # none (checkout unavailable) | mock (local/staging, refused in production) | <real, F13>
  smsProvider: none                # none (no SMS) | console (logs, refused in production) | smsir
  smsir:                           # sms.ir "verify" templates; the API key comes from secrets.sms (as for Keycloak)
    # Approved template ids: "subscription_expiring=…,subscription_ended=…,price_alert=…,price_update=…" (params: PLAN DAYS
    # DATE / PLAN / PRODUCT PRICE CHANGE / METAL COUNT). A message whose template has no id isn't sent and is logged as failed.
    templates: ""
  redisUrl: ""                     # default: the alanfelez-data Redis service
  corsOrigins: []                  # defaults to the web origin
  # Who may set X-Forwarded-For (client IP for rate limits). Empty = the app default (private ranges: ingress, website, pods).
  # Production behind the Arvan CDN: add the CDN's published edge ranges, or every visitor shares the edge IP (DEPLOYMENT §6).
  trustedProxies: []
  extraEnv: {}
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# Background jobs (River): price fetching, clean-up. Periodic jobs run on one elected leader,
# so extra replicas are safe (they only add capacity).
worker:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

web:
  replicas: 2
  indexable: false                 # true only in production: staging must never be indexed by search engines
  cspFormOrigins: []               # payment gateway origins for the CSP form-action (default: the API when mock)
  extraEnv: {}
  # CPU autoscaling (needs metrics-server; k3s has it). Off by default; production turns it on.
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, cpuPercent: 70 }
  # Measured: ~480 MiB RSS at full load per pod, and a whole core at ~55 pages/s.
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 768Mi }

admin:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 128Mi }

keycloak:
  replicas: 1
  strategy: RollingUpdate          # Recreate for single-replica, memory-constrained clusters
  otp:
    smsProvider: console           # id of the SmsSender SPI provider: console | smsir
    consoleAllowed: false          # the console sender only logs codes, never true in production
    ttlSeconds: 300                # how long a code stays valid (SMS can take a minute); new codes after 120 s still
    smsir:                         # sms.ir "verify" (ارسال سریع); the API key comes from secrets.sms
      templateId: ""               # id of the approved template on the sms.ir panel
      parameter: CODE              # the template's parameter that receives the code
  profileSync:
    enabled: true                  # PreSync job: apply the realm file's user profile to the running realm
  sessionLimit: 2                  # devices signed in at once per account (the oldest is signed out); 0 = no limit.
                                   # Applied by the profile job once; to change it later use the Keycloak admin console
  extraEnv: {}
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }

bootstrap:
  enabled: true                    # migrations + seed before every sync (Argo CD PreSync / Helm pre-install,pre-upgrade)
  startupTimeout: 10m

# Argo Rollouts canary for api and web (ADR-0020). enabled=false renders plain Deployments.
rollout:
  enabled: true
  # 1. setWeight 50 completes only when the canary pods are Ready. If they never are, the progress deadline aborts.
  # 2. The analysis step then measures the canary pods through the canary Service (which Argo Rollouts points at
  #    the new ReplicaSet once it's available). Any failed check aborts, and the stable version keeps serving.
  # "{{analysis}}" is replaced with the workload's AnalysisTemplate (api only; web skips it).
  steps:
    - setWeight: 50
    - analysis: "{{analysis}}"
    - pause: { duration: 30s }
    - setWeight: 100
  progressDeadlineSeconds: 180
  analysis:
    interval: 10s
    count: 3
    failureLimit: 0
    consecutiveErrorLimit: 2

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    clusterIssuer: letsencrypt     # cert-manager ClusterIssuer
  # A shared username/password in front of some hosts (staging: keeps the public and search engines off a test site).
  # Traefik basicAuth; the htpasswd lines live in a SealedSecret (key `users`), see environments/staging/secrets/README.md.
  # Only for browser-facing hosts: the API and Keycloak are called with their own Authorization headers and stay open.
  basicAuth:
    enabled: false
    secretName: alanfelez-basic-auth
    hosts: [web, admin]
  # Other names that permanently redirect (301) to the website, keeping the path: www., the .com domain (SCOPE §2).
  # Each gets a certificate, so https://alanfelez.com/x also redirects cleanly.
  redirectHosts: []

# Local clusters only: render the secrets above from these values. Never in staging/production.
devSecrets:
  enabled: false
  authSecret: local-only-auth-secret-change-me-0123456789
  webClientSecret: local-web-secret-change-me
  keycloakAdminPassword: admin

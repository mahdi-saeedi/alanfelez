{{- if .Values.devSecrets.enabled }}
# LOCAL CLUSTERS ONLY. Staging/production provide these secrets as SealedSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.app }}
  labels: {{- include "af.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ .Values.devSecrets.authSecret | quote }}
  KC_WEB_CLIENT_SECRET: {{ .Values.devSecrets.webClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.keycloakAdmin }}
  labels: {{- include "af.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: {{ .Values.devSecrets.keycloakAdminPassword | quote }}
{{- end }}

{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- $auth := .Values.ingress.basicAuth }}
{{- if $auth.enabled }}
---
# Shared password for test environments (values: ingress.basicAuth). The secret holds htpasswd lines under `users`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $root.Release.Name }}-basic-auth
  labels: {{- include "af.labels" $root | nindent 4 }}
spec:
  basicAuth:
    secret: {{ $auth.secretName }}
    realm: Alan Felez staging
    removeHeader: true
{{- end }}
{{- range $name, $svc := dict "web" (dict "port" 3000) "api" (dict "port" 8080) "keycloak" (dict "port" 8080 "host" "auth") "admin" (dict "port" 8080) }}
{{- $hostKey := default $name $svc.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels: {{- include "af.labels" $root | nindent 4 }}
  {{- $protect := and $auth.enabled (has $name $auth.hosts) }}
  {{- if or $root.Values.ingress.tls.enabled $protect }}
  annotations:
    {{- if $root.Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $root.Values.ingress.tls.clusterIssuer }}
    {{- end }}
    {{- if $protect }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $root.Release.Namespace }}-{{ $root.Release.Name }}-basic-auth@kubernetescrd
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $root.Values.ingress.className }}
  {{- if $root.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ index $root.Values.global.hosts $hostKey }}]
      secretName: {{ $root.Release.Name }}-{{ $name }}-tls
  {{- end }}
  rules:
    - host: {{ index $root.Values.global.hosts $hostKey }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Release.Name }}-{{ $name }}
                port: { number: {{ $svc.port }} }
{{- end }}
{{- with $root.Values.ingress.redirectHosts }}
---
# Redirect-only names (values: ingress.redirectHosts) → https://<web host><same path>.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $root.Release.Name }}-redirect-to-site
  labels: {{- include "af.labels" $root | nindent 4 }}
spec:
  redirectRegex:
    regex: "^https?://[^/]+(.*)"
    replacement: "https://{{ $root.Values.global.hosts.web }}${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Release.Name }}-redirects
  labels: {{- include "af.labels" $root | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $root.Release.Namespace }}-{{ $root.Release.Name }}-redirect-to-site@kubernetescrd
    {{- if $root.Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $root.Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $root.Values.ingress.className }}
  {{- if $root.Values.ingress.tls.enabled }}
  tls:
    - hosts: {{- toYaml . | nindent 8 }}
      secretName: {{ $root.Release.Name }}-redirects-tls
  {{- end }}
  rules:
    {{- range . }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Release.Name }}-web   # never reached: the middleware answers first
                port: { number: 3000 }
    {{- end }}
{{- end }}
{{- end }}

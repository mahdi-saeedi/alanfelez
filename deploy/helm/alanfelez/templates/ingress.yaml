{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- range $name, $svc := dict "web" (dict "port" 3000) "api" (dict "port" 8080) "keycloak" (dict "port" 8080 "host" "auth") "admin" (dict "port" 8080) }}
{{- $hostKey := default $name $svc.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels: {{- include "af.labels" $root | nindent 4 }}
  {{- if $root.Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $root.Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ $root.Values.ingress.className }}
  {{- if $root.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ index $root.Values.global.hosts $hostKey }}]
      secretName: {{ $root.Release.Name }}-{{ $name }}-tls
  {{- end }}
  rules:
    - host: {{ index $root.Values.global.hosts $hostKey }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Release.Name }}-{{ $name }}
                port: { number: {{ $svc.port }} }
{{- end }}
{{- end }}

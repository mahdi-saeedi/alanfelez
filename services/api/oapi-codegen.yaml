# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: internal/api/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: false
  # The SSE stream is hand-written (internal/prices/live); the generated server can't stream.
  exclude-operation-ids: [streamPrices]

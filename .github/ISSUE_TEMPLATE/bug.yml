name: Bug
description: Something doesn't work as specified
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened vs. what was expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: "Locale (fa/en), device, tier, URL" }
    validations: { required: true }
  - type: input
    id: requestid
    attributes: { label: Request ID / GlitchTip link (if any) }

# One-click rollback (docs/guides/DEPLOYMENT.md §5): writes an older image tag to the environment and commits.
# Argo CD syncs it like any deploy. Production requires the "production" GitHub Environment approval.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [staging, production]
        required: true
      version:
        description: Image tag to restore (e.g. v1.4.2 or sha-abc123def456). Empty = the previously deployed tag.
        type: string
        required: false

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 50 }
      - name: Resolve version
        id: v
        env: { FILE: "deploy/environments/${{ inputs.environment }}/values.yaml", WANT: "${{ inputs.version }}" }
        run: |
          current="$(yq '.images.api.tag' "$FILE")"
          if [ -n "$WANT" ]; then target="$WANT"; else
            # the api tag in the file before the last change of this file
            target="$(git log -n 2 --format=%H -- "$FILE" | tail -1 | xargs -I{} git show {}:"$FILE" | yq '.images.api.tag')"
          fi
          [ -n "$target" ] && [ "$target" != "$current" ] || { echo "Nothing to roll back (current=$current, target=$target)"; exit 1; }
          echo "current=$current" >> "$GITHUB_OUTPUT"; echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Commit rollback
        env: { FILE: "deploy/environments/${{ inputs.environment }}/values.yaml", TAG: "${{ steps.v.outputs.target }}" }
        run: |
          yq -i '.images.api.tag = strenv(TAG) | .images.web.tag = strenv(TAG) | .images.keycloak.tag = strenv(TAG) | .images.admin.tag = strenv(TAG)' "$FILE"
          git config user.name "alanfelez-bot"
          git config user.email "bot@alanfelez.ir"
          git commit -am "revert(deploy): ${{ inputs.environment }} ${{ steps.v.outputs.current }} → ${TAG} (by @${{ github.actor }}) [skip ci]"
          git push
          echo "### Rolled back ${{ inputs.environment }} to \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

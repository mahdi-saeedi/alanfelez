# Delivery (ADR-0020): build + push images, then change git. Argo CD does the actual deploy.
#   push to main (a merged PR, or ship.yml starting it) → images :sha-<12> → commit the tag to deploy/environments/staging
# Production never rebuilds: publish.yml promotes the images staging runs (tested) as vX.Y.Z.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:     # ship.yml starts it after merging (merges made by a workflow don't trigger pushes)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # ArvanCloud registry (inside Iran, so the servers pull at full speed; DEPLOYMENT.md §3). Not a secret: the login is in
  # secrets.REGISTRY_USERNAME / REGISTRY_PASSWORD. A repo variable REGISTRY_HOST overrides it (e.g. for a fork).
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry-b73b5f9c02-alanfelez.apps.ir-central1.arvancaas.ir' }}
  REGISTRY: ${{ vars.REGISTRY_HOST || 'registry-b73b5f9c02-alanfelez.apps.ir-central1.arvancaas.ir' }}/alanfelez

jobs:
  images:
    runs-on: ubuntu-latest
    # A push to the registry in Iran can hang without failing (2026-10-26: 25+ min on the Keycloak image). Without a
    # limit the job waits up to 6 h and every later release queues behind it.
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      # One image failing (usually the registry in Iran) must not cancel the others mid-push.
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: keycloak, dockerfile: services/keycloak/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # The ArvanCloud registry sometimes times out or answers 404 for a moment (seen 2026-10-23), so the login is
      # retried and a failed push gets a second try (all layers come from the cache, so it's quick).
      - name: Log in to the registry (with retries)
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin && exit 0
            echo "login failed (try $i), retrying in $((i * 15))s"; sleep $((i * 15))
          done
          exit 1
      - id: push
        continue-on-error: true
        timeout-minutes: 20 # a hung push counts as failed, so the second try below runs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Wait before the second push
        if: steps.push.outcome == 'failure'
        run: sleep 60
      - name: Push again (the first push failed)
        if: steps.push.outcome == 'failure'
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
      # Same build again, all layers from the cache just written, loaded into the runner's Docker engine so the scan
      # reads it locally instead of downloading it back from the registry in Iran (that link drops long streams on the
      # large Keycloak image). It can't share the step above: load doesn't work together with provenance/SBOM.
      - name: Load the image for the scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Trivy finds the image in the local Docker engine (load: true above); the registry is the fallback.
          timeout: 15m
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Bump staging image tags (GitOps)
        env: { TAG: "${{ needs.images.outputs.tag }}" }
        run: |
          git config user.name "alanfelez-bot"
          git config user.email "bot@alanfelez.ir"
          # main may have moved while the images were building (often another release's own bump of these very lines,
          # which made a rebase conflict): start from the newest main each time and set the tags there.
          for _ in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            yq -i '.images.api.tag = strenv(TAG) | .images.web.tag = strenv(TAG) | .images.keycloak.tag = strenv(TAG) | .images.admin.tag = strenv(TAG)' \
              deploy/environments/staging/values.yaml
            git diff --quiet && exit 0   # already on this tag
            git commit -qam "chore(deploy): staging → ${TAG} [skip ci]" && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

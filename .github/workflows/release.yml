# Delivery (ADR-0020): build + push images, then change git. Argo CD does the actual deploy.
#   push to main   → images :<sha> → commit the new tag to deploy/environments/staging (auto-sync)
#   tag vX.Y.Z     → images :vX.Y.Z → pull request bumping deploy/environments/production (review = approval)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # ArvanCloud registry (inside Iran, so the servers pull at full speed; DEPLOYMENT.md §3). Not a secret: the login is in
  # secrets.REGISTRY_USERNAME / REGISTRY_PASSWORD. A repo variable REGISTRY_HOST overrides it (e.g. for a fork).
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry-808c2160fb-alanfelez.apps.ir-central1.arvancaas.ir' }}
  REGISTRY: ${{ vars.REGISTRY_HOST || 'registry-808c2160fb-alanfelez.apps.ir-central1.arvancaas.ir' }}/alanfelez

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        image:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: keycloak, dockerfile: services/keycloak/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Bump staging image tags (GitOps)
        env: { TAG: "${{ needs.images.outputs.tag }}" }
        run: |
          yq -i '.images.api.tag = strenv(TAG) | .images.web.tag = strenv(TAG) | .images.keycloak.tag = strenv(TAG) | .images.admin.tag = strenv(TAG)' \
            deploy/environments/staging/values.yaml
          git config user.name "alanfelez-bot"
          git config user.email "bot@alanfelez.ir"
          git commit -am "chore(deploy): staging → ${TAG} [skip ci]"
          git push

  propose-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Bump production image tags
        env: { TAG: "${{ needs.images.outputs.tag }}" }
        run: |
          yq -i '.images.api.tag = strenv(TAG) | .images.web.tag = strenv(TAG) | .images.keycloak.tag = strenv(TAG) | .images.admin.tag = strenv(TAG)' \
            deploy/environments/production/values.yaml
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deploy/production-${{ needs.images.outputs.tag }}
          title: "chore(deploy): production → ${{ needs.images.outputs.tag }}"
          commit-message: "chore(deploy): production → ${{ needs.images.outputs.tag }}"
          body: |
            Merging this PR deploys **${{ needs.images.outputs.tag }}** to production (Argo CD sync + canary with automatic rollback).
            Checklist: staging verified · migrations are backward compatible · outside market hours (docs/guides/OPERATIONS.md §6).
          labels: deploy, production

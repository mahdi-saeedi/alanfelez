# Delivery (ADR-0020): build + push images, then change git. Argo CD does the actual deploy.
#   push to main (a merged PR, or ship.yml starting it) → images :sha-<12> → commit the tag to deploy/environments/staging
# Production never rebuilds: publish.yml promotes the images staging runs (tested) as vX.Y.Z.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:     # ship.yml starts it after merging (merges made by a workflow don't trigger pushes)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # ArvanCloud registry (inside Iran, so the servers pull at full speed; DEPLOYMENT.md §3). Not a secret: the login is in
  # secrets.REGISTRY_USERNAME / REGISTRY_PASSWORD. A repo variable REGISTRY_HOST overrides it (e.g. for a fork).
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry-b73b5f9c02-alanfelez.apps.ir-central1.arvancaas.ir' }}
  REGISTRY: ${{ vars.REGISTRY_HOST || 'registry-b73b5f9c02-alanfelez.apps.ir-central1.arvancaas.ir' }}/alanfelez

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        image:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: keycloak, dockerfile: services/keycloak/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # The image is pulled back from the registry in Iran; the large Keycloak image can take longer than
          # Trivy's 5-minute default, and a timeout fails the job and skips deploy-staging.
          timeout: 15m
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Bump staging image tags (GitOps)
        env: { TAG: "${{ needs.images.outputs.tag }}" }
        run: |
          yq -i '.images.api.tag = strenv(TAG) | .images.web.tag = strenv(TAG) | .images.keycloak.tag = strenv(TAG) | .images.admin.tag = strenv(TAG)' \
            deploy/environments/staging/values.yaml
          git config user.name "alanfelez-bot"
          git config user.email "bot@alanfelez.ir"
          git commit -am "chore(deploy): staging → ${TAG} [skip ci]"
          # main may have moved while the images were building: rebase on it and retry.
          for _ in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done; exit 1

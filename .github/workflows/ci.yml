# Quality gates for every pull request and every push to main (ADR-0013). All jobs must pass to merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go · lint, test, generate check, vulns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2            # installs the pinned toolchain from mise.toml
      - run: task generate:check
      - run: task lint:go
      - run: task test
      - name: govulncheck
        working-directory: services/api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  keycloak-extensions:
    name: Keycloak extension · mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp test
        working-directory: services/keycloak/extensions

  frontend:
    name: Web + theme · typecheck, build, api-client check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm --filter @alanfelez/api-client generate && git diff --exit-code -- packages/api-client
      - run: pnpm --filter @alanfelez/keycloak-theme typecheck
      - run: pnpm --filter @alanfelez/web typecheck
      - run: pnpm --filter @alanfelez/web build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  deploy-manifests:
    name: Helm · lint + render + schema validation (every environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Lint and validate
        run: |
          for env in local staging production; do
            helm lint deploy/helm/alanfelez -f deploy/environments/$env/values.yaml
            helm lint deploy/helm/alanfelez-data -f deploy/environments/$env/data-values.yaml
            { helm template alanfelez deploy/helm/alanfelez -f deploy/environments/$env/values.yaml
              helm template alanfelez-data deploy/helm/alanfelez-data -f deploy/environments/$env/data-values.yaml
            } | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  images:
    name: Docker images build (no push)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: keycloak, dockerfile: services/keycloak/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  smoke:
    name: Smoke test · full stack in Docker Compose
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d --wait --wait-timeout 600 postgres redis keycloak api web
      - run: deploy/local/smoke.sh http://localhost:8080 http://localhost:3000 http://localhost:8081
      - if: failure()
        run: docker compose logs --no-color | tail -300

  security:
    name: Security · secrets + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@0.33.1
        with: { scan-type: fs, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }

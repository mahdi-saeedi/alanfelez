openapi: 3.1.0
info:
  title: Alan Felez API
  version: 0.5.0
  description: |
    Public, user and admin API for الان‌فلز. Contract-first (ADR-0014): edit this file,
    then run `task generate`. Conventions: docs/architecture/API_GUIDELINES.md.
servers:
  - url: http://localhost:8080
    description: local
tags:
  - name: reference
    description: Reference data (metals, markets, plans)
  - name: prices
    description: Latest prices and price history. Visibility depends on the caller's tier (internal/access)
  - name: me
    description: The calling user
  - name: billing
    description: Checkout and payments (SCOPE §6, SECURITY §7). The gateway callback is never trusted; the API verifies server-to-server
  - name: content
    description: CMS content (articles, FAQ, pages, site settings). Analysis and forecast bodies depend on the caller's tier
  - name: support
    description: Contact form and user tickets (SCOPE §12)
  - name: gold
    description: Gold features (SCOPE §7, §8, #19) — IME daily offerings, load calculator, SMS price alerts
  - name: admin
    description: Staff only (realm role `staff`; writes need `editor` or `admin`). Every write is audit-logged

security:
  - {}
  - bearerAuth: []

paths:
  /v1/metals:
    get:
      operationId: listMetals
      tags: [reference]
      summary: List base metals
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Metals in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Metal' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/categories:
    get:
      operationId: listCategories
      tags: [reference]
      summary: List product categories (raw materials, intermediate products, scrap)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Categories in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Localized' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/markets:
    get:
      operationId: listMarkets
      tags: [reference]
      summary: List markets / price sources
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Markets in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Market' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/plans:
    get:
      operationId: listPlans
      tags: [reference]
      summary: List active subscription plans with current prices
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Plans ordered by rank
          content:
            application/json:
              schema:
                type: object
                required: [items, purchasable]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
                  purchasable:
                    type: boolean
                    description: Whether plans can be bought now (feature flag payments.enabled)
        default: { $ref: '#/components/responses/Problem' }

  /v1/prices:
    get:
      operationId: listPrices
      tags: [prices]
      summary: Latest price per series
      description: |
        Free (and anonymous) callers get the base series only; `lockedCount` says how many more exist (teaser).
        Locked rows are never returned. Always show `source` and `observedAt` next to a price.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: metal, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: market, in: query, required: false, schema: { type: string } }
        - name: base
          in: query
          required: false
          description: Only the base series (the ticker and home cards). Doesn't count as using a paid feature
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Latest prices in display order
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/series/{slug}/points:
    get:
      operationId: listSeriesPoints
      tags: [prices]
      summary: Price history of one series, downsampled to at most ~300 points
      description: |
        Each point is the last published price in its time bucket (a "close"). Ranges beyond the caller's
        `chart.history_days` limit, and series the tier can't see, answer 403 FEATURE_LOCKED.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: slug, in: path, required: true, schema: { type: string } }
        - name: range
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ChartRange' }
      responses:
        '200':
          description: Points in time order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesHistory' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/prices/stream:
    get:
      operationId: streamPrices
      tags: [prices]
      summary: Live price updates (Server-Sent Events)
      description: |
        Implemented by hand (internal/prices/live), not by the generated server. On connect the server sends the
        current price of every visible series, then one `price` event per published point. A comment line is sent
        every 25 s as a heartbeat. Visibility is fixed when the stream opens (reconnect after a plan change).
      parameters:
        - name: series
          in: query
          required: false
          description: Comma-separated series slugs to limit the stream
          schema: { type: string }
      responses:
        '200':
          description: 'Event stream. `event: price`, `data`: PriceEvent JSON'
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/PriceEvent' }

  /v1/me/entitlements:
    get:
      operationId: getEntitlements
      tags: [me]
      summary: Evaluated feature map for the caller (anonymous = free)
      responses:
        '200':
          description: Tier, features and limits
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user's profile and current plan (refreshes the local profile from the token)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/subscriptions:
    get:
      operationId: listMySubscriptions
      tags: [me]
      summary: The user's subscriptions, newest first (includes queued ones)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MySubscription' }
        '401': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/orders:
    get:
      operationId: listMyOrders
      tags: [me]
      summary: The user's orders (billing history), newest first
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/orders/{id}:
    get:
      operationId: getMyOrder
      tags: [me]
      summary: One of the user's orders (payment result page)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/orders/{id}/refund:
    post:
      operationId: requestRefund
      tags: [me]
      summary: Ask for a refund (within 7 days of payment, if no paid feature was used)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Refund requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/checkout/quote:
    post:
      operationId: quoteCheckout
      tags: [billing]
      summary: Price a purchase for the user (credit for an upgrade, start date for a renewal) without creating anything
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutInput' }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutQuote' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/checkout:
    post:
      operationId: startCheckout
      tags: [billing]
      summary: Create an order and start its payment. Returns the gateway URL to send the browser to
      description: |
        Idempotent per Idempotency-Key: repeating the request returns the same order (and payment page).
        When credit covers the whole price, the plan is activated at once and no redirect is returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutInput' }
      responses:
        '201':
          description: Order created (or the existing one for this key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/payments/verify:
    post:
      operationId: verifyPayment
      tags: [billing]
      summary: Complete a payment after the gateway redirected the browser back (called by the website's callback page)
      description: |
        No authentication: the callback can arrive after the session ended. Nothing in the request is trusted; the
        API asks the gateway server-to-server and checks the order, authority and amount. Safe to repeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, params]
              properties:
                orderId: { type: string, format: uuid }
                params:
                  type: object
                  description: The gateway's callback query parameters, as received
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Order status after verification
          content:
            application/json:
              schema:
                type: object
                required: [orderId, status]
                properties:
                  orderId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/OrderStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Search users by mobile, name or id (max 50)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: Latest orders (max 100), optionally filtered
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: refundStatus, in: query, required: false, schema: { $ref: '#/components/schemas/RefundStatus' } }
        - { name: userId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/refunds/{id}/decision:
    post:
      operationId: adminDecideRefund
      tags: [admin]
      summary: Approve (order refunded, plan cancelled) or reject a refund request. Role, admin
      description: The money itself is returned outside the system; put the transfer reference in the note.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Refund after the decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/series:
    get:
      operationId: adminListSeries
      tags: [admin]
      summary: Every series with its latest price and outlier threshold
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All series
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSeries' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: adminCreateSeries
      tags: [admin]
      summary: Add a price series (product × market × currency × unit). Roles, editor, admin
      description: |
        New series are never base series: the free tier sees base series only, which is the tier matrix
        (internal/access) and changes through the owner, not the admin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSeriesInput' }
      responses:
        '201':
          description: Series added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSeries' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/prices:
    post:
      operationId: adminCreatePrice
      tags: [admin]
      summary: Manual price entry (fallback when a source is down, SCOPE §13)
      description: |
        A move larger than the series' outlier threshold answers 422 PRICE_JUMP unless `force` is true.
        Roles: editor, admin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPriceInput' }
      responses:
        '201':
          description: Point stored and published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoint' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/prices/bulk:
    post:
      operationId: adminBulkPrices
      tags: [admin]
      summary: Bulk manual entry (the admin parses the CSV). Run with dryRun first to show the diff
      description: |
        Rows are validated independently. With `dryRun` nothing is stored. Otherwise valid rows are stored in one
        transaction and rows with a jump are skipped unless `force`. Roles: editor, admin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/ManualPriceInput' }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: Per-row results, in input order
          content:
            application/json:
              schema:
                type: object
                required: [items, stored]
                properties:
                  stored: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BulkPriceResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/prices/quarantine:
    get:
      operationId: adminListQuarantine
      tags: [admin]
      summary: Points held back by the outlier gate, oldest first
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Quarantined points
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPoint' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/prices/{id}/review:
    post:
      operationId: adminReviewPrice
      tags: [admin]
      summary: Approve (publish) or reject a quarantined point. Roles, editor, admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: Point after review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoint' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/series/{slug}/points:
    get:
      operationId: adminSeriesPoints
      tags: [admin]
      summary: Recent points of one series, newest first, with who entered or voided each (price history)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Points, every status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPoint' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/prices/{id}/void:
    post:
      operationId: adminVoidPrice
      tags: [admin]
      summary: Void a published point (a wrong entry). It is kept as rejected, never deleted. Roles, editor, admin
      description: |
        The point leaves the site and the charts; when it was the latest price, the previous published point becomes
        the latest again. SMS alerts it already triggered are not taken back. Audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Point after voiding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoint' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/catalog:
    get:
      operationId: adminCatalog
      tags: [admin]
      summary: Metals, products (active and inactive), categories and markets, for the catalog page
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                required: [metals, products, categories, markets]
                properties:
                  metals:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCatalogItem' }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProduct' }
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCatalogItem' }
                  markets:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCatalogItem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/metals:
    post:
      operationId: adminCreateMetal
      tags: [admin]
      summary: Add a metal. Roles, editor, admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMetalInput' }
      responses:
        '201':
          description: Metal added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCatalogItem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/products:
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Add a product of a metal. Roles, editor, admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProductInput' }
      responses:
        '201':
          description: Product added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/catalog/active:
    post:
      operationId: adminSetCatalogActive
      tags: [admin]
      summary: Deactivate or reactivate a product or a price series (nothing is deleted). Roles, editor, admin
      description: An inactive product or series disappears from the site; its history stays. Audited.

        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TicketStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTicket' }
        default: { $ref: '#/components/responses/Problem' }

  # --- Gold features (M5) -----------------------------------------------------------

  /v1/auctions:
    get:
      operationId: getAuctions
      tags: [gold]
      summary: IME daily offerings for one day (default = the latest day with data). Rows need auctions.read (Gold)
      description: Everyone gets the day's summary and the list of dates; `items` is left out when locked (FEATURE teaser).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: metal, in: query, required: false, schema: { type: string, maxLength: 60 } }
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionDay' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/calculator/estimate:
    post:
      operationId: estimateLoad
      tags: [gold]
      summary: Estimate a load's value (SCOPE §8). Needs calculator.use (Gold) → 403 FEATURE_LOCKED
      description: With `series` and no `unitPriceRialPerKg`, the series' latest price is used (IRR series only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculatorInput' }
      responses:
        '200':
          description: The estimate (an estimate, never a final price)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculatorResult' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/calculations:
    get:
      operationId: listMyCalculations
      tags: [me, gold]
      summary: Saved calculations (newest first, max 50)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Calculations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedCalculation' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: saveMyCalculation
      tags: [me, gold]
      summary: Compute and save a calculation (Gold). 409 CONFLICT at 50 saved
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, input]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                input: { $ref: '#/components/schemas/CalculatorInput' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedCalculation' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/calculations/{id}:
    delete:
      operationId: deleteMyCalculation
      tags: [me, gold]
      summary: Delete a saved calculation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/alerts:
    get:
      operationId: listMyAlerts
      tags: [me, gold]
      summary: The caller's SMS price alerts (listed even after the plan lapses, so they can be removed)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: object
                required: [items, max]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PriceAlert' }
                  max: { type: integer, description: Most alerts one user may have }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMyAlert
      tags: [me, gold]
      summary: Add an SMS price alert. Needs alerts.sms (Gold) → 403 FEATURE_LOCKED; 409 CONFLICT at the maximum
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AcceptLanguage' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceAlertInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceAlert' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/alerts/{id}:
    put:
      operationId: setMyAlertActive
      tags: [me, gold]
      summary: Pause or resume an alert (resuming needs Gold and re-arms it)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '204': { description: Updated }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMyAlert
      tags: [me, gold]
      summary: Delete an alert
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/auctions:
    get:
      operationId: adminListAuctions
      tags: [admin]
      summary: IME offerings of one day, for editing
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Offerings
          content:
            application/json:
              schema:
                type: object
                required: [items, dates]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminOffering' }
                  dates:
                    type: array
                    items: { type: string, format: date }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/auctions/bulk:
    post:
      operationId: adminBulkAuctions
      tags: [admin]
      summary: Add or correct offerings (one row = one form entry, many = a pasted table). Roles, editor, admin
      description: Rows are keyed by (tradeDate, productFa, producerFa); re-entering a row corrects it. With dryRun nothing is saved.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items: { $ref: '#/components/schemas/AdminOfferingInput' }
                dryRun: { type: boolean }
      responses:
        '200':
          description: Per-row result
          content:
            application/json:
              schema:
                type: object
                required: [results, saved]
                properties:
                  saved: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [index, ok]
                      properties:
                        index: { type: integer }
                        ok: { type: boolean }
                        inserted: { type: boolean }
                        error: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /v1/admin/auctions/{id}:
    delete:
      operationId: adminDeleteAuction
      tags: [admin]
      summary: Delete an offering entered by mistake. Roles, editor, admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (audience alanfelez-api)

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: [fa, en], default: fa }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Currency:
      type: string
      enum: [IRR, USD]
    Unit:
      type: string
      enum: [kg, ton]
    Tier:
      type: string
      description: Subscription tier (plan code)
      enum: [free, silver, gold]
    PaidPlan:
      type: string
      enum: [silver, gold]

    Metal:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, example: copper }
        name: { type: string, example: مس }

    Market:
      type: object
      required: [slug, name, scope]
      properties:
        slug: { type: string, example: ime }
        name: { type: string }
        scope: { type: string, enum: [domestic, global] }

    Money:
      type: object
      description: Amount as a string of integer minor units (Rial for IRR) to avoid JS precision loss.
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?[0-9]+$', example: '10000000' }
        currency: { $ref: '#/components/schemas/Currency' }

    PlanPrice:
      type: object
      required: [period, price]
      properties:
        period: { type: string, enum: [month, quarter, year] }
        price: { $ref: '#/components/schemas/Money' }

    Plan:
      type: object
      required: [code, name, rank, prices, features, limits]
      properties:
        features:
          type: object
          description: What this plan includes (evaluated from internal/access; the UIs never keep their own matrix)
          additionalProperties: { type: boolean }
        limits:
          type: object
          description: 0 = unlimited
          additionalProperties: { type: integer }
        code: { $ref: '#/components/schemas/Tier' }
        name: { type: string }
        rank: { type: integer }
        prices:
          type: array
          items: { $ref: '#/components/schemas/PlanPrice' }

    Localized:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    SeriesRef:
      type: object
      required: [slug, product, metal, category, market, currency, unit, isBase]
      properties:
        slug: { type: string, example: copper-red-free }
        product: { $ref: '#/components/schemas/Localized' }
        metal: { $ref: '#/components/schemas/Localized' }
        category: { $ref: '#/components/schemas/Localized' }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        unit: { $ref: '#/components/schemas/Unit' }
        isBase: { type: boolean, description: Visible to the free tier }

    Price:
      type: object
      description: Integer minor units per unit (Rial per kg for IRR, US cents per ton for USD) as a string.
      required: [amount, currency, unit]
      properties:
        amount: { type: string, pattern: '^[0-9]+$', example: '64000000' }
        currency: { $ref: '#/components/schemas/Currency' }
        unit: { $ref: '#/components/schemas/Unit' }

    PriceChange:
      type: object
      description: Change against the previous day's close (Asia/Tehran calendar day)
      required: [amount, bp]
      properties:
        amount: { type: string, pattern: '^-?[0-9]+$', description: Minor units }
        bp: { type: integer, description: 'Basis points (125 = +1.25 %)' }

    PriceRow:
      type: object
      required: [series]
      properties:
        series: { $ref: '#/components/schemas/SeriesRef' }
        price: { $ref: '#/components/schemas/Price' }
        change: { $ref: '#/components/schemas/PriceChange' }
        observedAt: { type: string, format: date-time }
        source: { type: string, description: 'Where the price comes from, in the requested language' }

    PriceList:
      type: object
      required: [items, lockedCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PriceRow' }
        lockedCount:
          type: integer
          description: Series hidden by the caller's tier (matching the filters)
        lockedFeature: { $ref: '#/components/schemas/FeatureLock' }

    FeatureLock:
      type: object
      required: [feature, requiredPlan]
      properties:
        feature: { type: string, example: prices.full }
        requiredPlan: { $ref: '#/components/schemas/Tier' }

    ChartRange:
      type: string
      enum: [1D, 1W, 1M, 3M, 6M, 1Y, 3Y, MAX]
      default: 1M

    SeriesPoint:
      type: object
      required: [t, amount]
      properties:
        t: { type: string, format: date-time, description: Time of the last point in the bucket }
        amount: { type: string, pattern: '^[0-9]+$' }

    SeriesHistory:
      type: object
      required: [series, range, from, to, intervalSeconds, points]
      properties:
        series: { $ref: '#/components/schemas/SeriesRef' }
        range: { $ref: '#/components/schemas/ChartRange' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        intervalSeconds: { type: integer, description: Bucket size used for downsampling }
        points:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
        source: { type: string }

    PriceEvent:
      type: object
      required: [series, price, observedAt]
      properties:
        series: { type: string, description: Series slug }
        price: { $ref: '#/components/schemas/Price' }
        change: { $ref: '#/components/schemas/PriceChange' }
        observedAt: { type: string, format: date-time }

    Entitlements:
      type: object
      required: [authenticated, tier, features, limits]
      properties:
        authenticated: { type: boolean }
        tier: { $ref: '#/components/schemas/Tier' }
        tierEndsAt: { type: string, format: date-time }
        features:
          type: object
          additionalProperties: { type: boolean }
          example: { prices.base: true, prices.full: false }
        limits:
          type: object
          additionalProperties: { type: integer }
          description: 0 = unlimited
          example: { chart.history_days: 30 }

    ManualPriceInput:
      type: object
      required: [series, amount]
      properties:
        series: { type: string, description: Series slug }
        amount: { type: string, pattern: '^[0-9]+$', description: 'Minor units per series unit (Rial/kg, cents/ton)' }
        observedAt: { type: string, format: date-time, description: Defaults to now. Can't be in the future }
        force: { type: boolean, default: false, description: Store even if the move exceeds the outlier threshold }

    AdminPoint:
      type: object
      required: [id, series, amount, observedAt, status, isManual, source, createdAt]
      properties:
        id: { type: string }
        series: { type: string }
        amount: { type: string }
        previousAmount: { type: string, description: Latest published price when the point arrived }
        jumpBp: { type: integer }
        observedAt: { type: string, format: date-time }
        status: { type: string, enum: [published, quarantined, rejected] }
        isManual: { type: boolean }
        source: { type: string, description: Source slug }
        enteredBy: { type: string }
        enteredByName: { type: string, description: Staff member who entered it (manual points) }
        reviewedByName: { type: string, description: Staff member who approved, rejected or voided it }
        reviewedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AdminCatalogItem:
      type: object
      required: [slug, nameFa]
      properties:
        slug: { type: string }
        nameFa: { type: string }
        nameEn: { type: string }

    AdminProduct:
      type: object
      required: [slug, metal, category, nameFa, active]
      properties:
        slug: { type: string }
        metal: { type: string }
        category: { type: string }
        nameFa: { type: string }
        nameEn: { type: string }
        active: { type: boolean }

    AdminMetalInput:
      type: object
      required: [slug, nameFa]
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]{2,40}$' }
        nameFa: { type: string, minLength: 1, maxLength: 80 }
        nameEn: { type: string, maxLength: 80 }

    AdminProductInput:
      type: object
      required: [slug, metal, category, nameFa]
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]{2,60}$' }
        metal: { type: string }
        category: { type: string }
        nameFa: { type: string, minLength: 1, maxLength: 120 }
        nameEn: { type: string, maxLength: 120 }

    AdminSeriesInput:
      type: object
      required: [slug, product, market, currency, unit]
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]{2,80}$' }
        product: { type: string }
        market: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        unit: { $ref: '#/components/schemas/Unit' }
        maxJumpBp: { type: integer, minimum: 100, maximum: 10000, description: Outlier gate in basis points (default 1500 = 15 %) }

    BulkPriceResult:
      type: object
      required: [index, series, status]
      properties:
        index: { type: integer }
        series: { type: string }
        status: { type: string, enum: [ok, stored, jump, invalid, duplicate] }
        message: { type: string }
        previousAmount: { type: string }
        jumpBp: { type: integer }

    AdminSeries:
      type: object
      required: [slug, productFa, market, currency, unit, isBase, active, maxJumpBp]
      properties:
        slug: { type: string }
        productFa: { type: string }
        productEn: { type: string }
        metal: { type: string }
        market: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        unit: { $ref: '#/components/schemas/Unit' }
        isBase: { type: boolean }
        active: { type: boolean }
        maxJumpBp: { type: integer }
        latestAmount: { type: string }
        latestAt: { type: string, format: date-time }
        latestSource: { type: string }

    SourceHealth:
      type: object
      required: [slug, name, provider, active, stale, staleAfterSeconds]
      properties:
        slug: { type: string }
        name: { type: string }
        provider: { type: string }
        active: { type: boolean }
        fetchIntervalSeconds: { type: integer }
        staleAfterSeconds: { type: integer }
        lastRunAt: { type: string, format: date-time }
        lastRunStatus: { type: string, enum: [ok, error] }
        lastError: { type: string }
        lastSuccessAt: { type: string, format: date-time }
        lastPointAt: { type: string, format: date-time }
        stale: { type: boolean, description: No point newer than staleAfterSeconds }

    Subscription:
      type: object
      required: [id, userId, plan, startsAt, endsAt, status, origin]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        plan: { $ref: '#/components/schemas/PaidPlan' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [active, cancelled] }
        origin: { type: string, enum: [manual, order] }
        note: { type: string }

    BillingPeriod:
      type: string
      enum: [month, quarter, year]

    OrderStatus:
      type: string
      enum: [pending, paid, failed, expired, refunded]

    RefundStatus:
      type: string
      enum: [requested, approved, rejected]

    Me:
      type: object
      required: [id, username, tier]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        phone: { type: string, description: E.164 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        current: { $ref: '#/components/schemas/MySubscription' }
        next: { $ref: '#/components/schemas/MySubscription' }

    MySubscription:
      type: object
      required: [id, plan, startsAt, endsAt, status, origin]
      properties:
        id: { type: string, format: uuid }
        plan: { $ref: '#/components/schemas/PaidPlan' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [active, cancelled, replaced] }
        origin: { type: string, enum: [manual, order] }

    CheckoutInput:
      type: object
      required: [plan, period]
      properties:
        plan: { $ref: '#/components/schemas/PaidPlan' }
        period: { $ref: '#/components/schemas/BillingPeriod' }

    CheckoutQuote:
      type: object
      required: [plan, period, kind, price, credit, amount, startsAt, endsAt]
      properties:
        plan: { $ref: '#/components/schemas/PaidPlan' }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        kind: { type: string, enum: [new, renewal, upgrade, downgrade] }
        price: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    CheckoutResult:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        redirectUrl: { type: string, description: Gateway payment page; absent when nothing is left to pay }

    Order:
      type: object
      required: [id, plan, period, kind, price, credit, amount, status, createdAt, refundable]
      properties:
        id: { type: string, format: uuid }
        plan: { $ref: '#/components/schemas/PaidPlan' }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        kind: { type: string, enum: [new, renewal, upgrade, downgrade] }
        price: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        refId: { type: string, description: Gateway receipt number }
        refundStatus: { $ref: '#/components/schemas/RefundStatus' }
        refundable: { type: boolean, description: A refund can be requested now }

    Refund:
      type: object
      required: [id, orderId, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        reason: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }

    AdminUser:
      type: object
      required: [id, username, createdAt, lastSeenAt, blocked, currentPlan]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        phone: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        blocked: { type: boolean }
        currentPlan: { $ref: '#/components/schemas/Tier' }
        currentEndsAt: { type: string, format: date-time }

    AdminOrder:
      type: object
      required: [id, userId, plan, period, kind, price, credit, amount, status, createdAt, gateway]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        username: { type: string }
        plan: { $ref: '#/components/schemas/PaidPlan' }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        kind: { type: string, enum: [new, renewal, upgrade, downgrade] }
        price: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        gateway: { type: string }
        refId: { type: string }
        refundId: { type: string, format: uuid }
        refundStatus: { $ref: '#/components/schemas/RefundStatus' }
        refundReason: { type: string }

    # --- content (M4) ----------------------------------------------------------------
    ArticleType:
      type: string
      enum: [news, analysis, forecast]
    ArticleStatus:
      type: string
      enum: [draft, published, archived]
    Outlook:
      type: string
      enum: [up, down, neutral]
      description: The author's view of the price direction (an estimate, never a promise)

    ArticleSummary:
      type: object
      required: [slug, type, title, summary, featured, readMinutes, publishedAt, locked]
      properties:
        slug: { type: string }
        type: { $ref: '#/components/schemas/ArticleType' }
        title: { type: string }
        summary: { type: string, description: Plain text }
        category: { $ref: '#/components/schemas/Localized' }
        metal: { $ref: '#/components/schemas/Localized' }
        outlook: { $ref: '#/components/schemas/Outlook' }
        featured: { type: boolean }
        coverUrl: { type: string }
        readMinutes: { type: integer }
        publishedAt: { type: string, format: date-time }
        locked: { type: boolean, description: The caller's plan doesn't include this type; the body won't be sent }
        requiredPlan: { $ref: '#/components/schemas/Tier' }

    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [updatedAt]
          properties:
            body: { type: string, description: Sanitized HTML. Absent when locked }
            author: { type: string }
            updatedAt: { type: string, format: date-time }

    ArticleList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArticleSummary' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    FaqItem:
      type: object
      required: [slug, question, answer, popular]
      properties:
        slug: { type: string, description: Stable deep link (/faq#slug) }
        question: { type: string }
        answer: { type: string, description: Sanitized HTML }
        popular: { type: boolean }

    FaqCategory:
      type: object
      required: [slug, name, items]
      properties:
        slug: { type: string }
        name: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/FaqItem' }

    Page:
      type: object
      required: [slug, title, body, version, updatedAt]
      properties:
        slug: { type: string }
        title: { type: string }
        body: { type: string, description: Sanitized HTML }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    ContactInfo:
      type: object
      description: "Empty fields are omitted (client answer #30: filled in later in the admin)"
      properties:
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        hours: { type: string }

    SiteInfo:
      type: object
      required: [contact, social, licensesPage, englishSite]
      properties:
        englishSite: { type: boolean, description: 'The English site at /en is public (flag locale.en). Off: /en redirects to Persian' }
        contact: { $ref: '#/components/schemas/ContactInfo' }
        social:
          type: object
          description: Network → URL, only the ones set
          additionalProperties: { type: string }
        licensesPage: { type: boolean, description: Show the licenses page and its footer link (flag page.licenses) }

    # --- support (M4) ----------------------------------------------------------------
    ContactSubject:
      type: string
      enum: [general, support, billing, partnership, feedback, other]
    ContactStatus:
      type: string
      enum: [new, handled, spam]

    ContactInput:
      type: object
      required: [name, phone, subject, body]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, minLength: 7, maxLength: 20, description: Persian digits are accepted }
        email: { type: string, maxLength: 200 }
        subject: { $ref: '#/components/schemas/ContactSubject' }
        body: { type: string, minLength: 10, maxLength: 5000 }
        website: { type: string, maxLength: 200, description: Honeypot. Humans leave it empty; filled = silently dropped }

    TicketStatus:
      type: string
      enum: [open, answered, closed]
      description: open = waiting for support, answered = waiting for the user

    Ticket:
      type: object
      required: [id, number, subject, status, priority, lastMessageAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { type: string, enum: [normal, high] }
        lastMessageAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }

    TicketMessage:
      type: object
      required: [id, staff, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { type: string, description: The user's name, or the support agent's username }
        staff: { type: boolean }
        body: { type: string, description: Plain text }
        createdAt: { type: string, format: date-time }

    TicketThread:
      type: object
      required: [ticket, messages]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/TicketMessage' }

    MessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    # --- admin: content & support (M4) ---------------------------------------------------
    AdminCategory:
      type: object
      required: [slug, nameFa, sort]
      properties:
        slug: { type: string, maxLength: 60 }
        nameFa: { type: string, minLength: 1, maxLength: 80 }
        nameEn: { type: string, maxLength: 80 }
        sort: { type: integer }

    AdminArticleRow:
      type: object
      required: [id, type, slug, status, featured, titleFa, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ArticleType' }
        slug: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        featured: { type: boolean }
        titleFa: { type: string }
        titleEn: { type: string }
        category: { type: string }
        metal: { type: string }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminArticleInput:
      type: object
      required: [type, slug, status, featured, titleFa, summaryFa, bodyFa]
      properties:
        type: { $ref: '#/components/schemas/ArticleType' }
        slug: { type: string, maxLength: 120 }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        category: { type: string, description: Article category slug }
        metal: { type: string, description: Metal slug }
        outlook: { $ref: '#/components/schemas/Outlook' }
        featured: { type: boolean }
        titleFa: { type: string, minLength: 3, maxLength: 200 }
        titleEn: { type: string, maxLength: 200 }
        summaryFa: { type: string, maxLength: 600 }
        summaryEn: { type: string, maxLength: 600 }
        bodyFa: { type: string, maxLength: 200000, description: HTML from the editor (sanitized on save) }
        bodyEn: { type: string, maxLength: 200000 }
        authorFa: { type: string, maxLength: 100 }
        authorEn: { type: string, maxLength: 100 }
        coverUrl: { type: string, maxLength: 500 }
        publishedAt: { type: string, format: date-time, description: Defaults to the first publish time }

    AdminArticle:
      allOf:
        - $ref: '#/components/schemas/AdminArticleInput'
        - type: object
          required: [id, readMinutes, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            readMinutes: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    AdminFaqInput:
      type: object
      required: [slug, category, questionFa, answerFa, popular, published, sort]
      properties:
        slug: { type: string, maxLength: 120, description: Ignored on update }
        category: { type: string }
        questionFa: { type: string, minLength: 3, maxLength: 300 }
        questionEn: { type: string, maxLength: 300 }
        answerFa: { type: string, maxLength: 20000 }
        answerEn: { type: string, maxLength: 20000 }
        popular: { type: boolean }
        published: { type: boolean }
        sort: { type: integer }

    AdminFaqItem:
      allOf:
        - $ref: '#/components/schemas/AdminFaqInput'
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }

    AdminPageRow:
      type: object
      required: [slug, titleFa, published, version, updatedAt]
      properties:
        slug: { type: string }
        titleFa: { type: string }
        titleEn: { type: string }
        published: { type: boolean }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    AdminPageInput:
      type: object
      required: [titleFa, bodyFa, published, version]
      properties:
        titleFa: { type: string, minLength: 2, maxLength: 200 }
        titleEn: { type: string, maxLength: 200 }
        bodyFa: { type: string, maxLength: 300000 }
        bodyEn: { type: string, maxLength: 300000 }
        published: { type: boolean }
        version: { type: integer, description: The version being edited (optimistic lock) }

    AdminPage:
      allOf:
        - $ref: '#/components/schemas/AdminPageInput'
        - type: object
          required: [slug, updatedAt]
          properties:
            slug: { type: string }
            updatedAt: { type: string, format: date-time }

    AdminSettings:
      type: object
      required: [contact, social]
      properties:
        contact:
          type: object
          required: [phone, email, addressFa, addressEn, hoursFa, hoursEn]
          properties:
            phone: { type: string, maxLength: 40 }
            email: { type: string, maxLength: 200 }
            addressFa: { type: string, maxLength: 300 }
            addressEn: { type: string, maxLength: 300 }
            hoursFa: { type: string, maxLength: 200 }
            hoursEn: { type: string, maxLength: 200 }
        social:
          type: object
          required: [telegram, instagram, linkedin, bale, eitaa]
          properties:
            telegram: { type: string, maxLength: 300 }
            instagram: { type: string, maxLength: 300 }
            linkedin: { type: string, maxLength: 300 }
            bale: { type: string, maxLength: 300 }
            eitaa: { type: string, maxLength: 300 }

    AdminContactMessage:
      type: object
      required: [id, name, phone, subject, body, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        subject: { $ref: '#/components/schemas/ContactSubject' }
        body: { type: string }
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        note: { type: string }
        handledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AdminTicket:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [userId, username]
          properties:
            userId: { type: string, format: uuid }
            username: { type: string }
            userName: { type: string, description: First and last name }

    AdminTicketThread:
      type: object
      required: [ticket, messages]
      properties:
        ticket: { $ref: '#/components/schemas/AdminTicket' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/TicketMessage' }

    # --- Gold features (M5) -----------------------------------------------------------
    AuctionOffering:
      type: object
      required: [id, metal, product, producer, offeredKg, basePriceRial]
      properties:
        id: { type: string, format: uuid }
        metal: { $ref: '#/components/schemas/Localized' }
        product: { type: string }
        producer: { type: string }
        offeredKg: { type: integer, format: int64 }
        basePriceRial: { type: integer, format: int64, description: Rial per kg }
        demandKg: { type: integer, format: int64 }
        tradedKg: { type: integer, format: int64 }
        clearingPriceRial: { type: integer, format: int64, description: Rial per kg, volume-weighted }
        changeBp: { type: integer, description: Clearing vs base, basis points }

    AuctionSummary:
      type: object
      required: [offerings, offeredKg, demandKg, tradedKg, value, avgChangeBp]
      properties:
        offerings: { type: integer }
        offeredKg: { type: integer, format: int64 }
        demandKg: { type: integer, format: int64 }
        tradedKg: { type: integer, format: int64 }
        value: { $ref: '#/components/schemas/Money' }
        avgChangeBp: { type: integer }

    AuctionDay:
      type: object
      required: [dates, summary, locked, source]
      properties:
        date: { type: string, format: date, description: Absent when there's no data at all }
        dates:
          type: array
          description: Recent trading days with data, newest first
          items: { type: string, format: date }
        summary: { $ref: '#/components/schemas/AuctionSummary' }
        items:
          type: array
          description: Absent when locked
          items: { $ref: '#/components/schemas/AuctionOffering' }
        locked: { type: boolean }
        requiredPlan: { $ref: '#/components/schemas/Tier' }
        source: { type: string, description: 'Where the data comes from, in the requested language' }
        updatedAt: { type: string, format: date-time }

    CalculatorInput:
      type: object
      required: [weightGrams, impurityBp, deductionBp, shippingRial, shippingPaidBy]
      properties:
        series: { type: string, description: 'IRR price series whose latest price is the base (optional)' }
        unitPriceRialPerKg: { type: integer, format: int64, description: Manual price; overrides the series price }
        weightGrams: { type: integer, format: int64, minimum: 0 }
        impurityBp: { type: integer, minimum: 0, maximum: 10000 }
        deductionBp: { type: integer, minimum: 0, maximum: 10000 }
        shippingRial: { type: integer, format: int64, minimum: 0 }
        shippingPaidBy: { type: string, enum: [seller, buyer] }

    CalculatorPrice:
      type: object
      required: [series, product, observedAt]
      properties:
        series: { type: string }
        product: { type: string }
        source: { type: string }
        observedAt: { type: string, format: date-time }

    CalculatorResult:
      type: object
      required: [input, netWeightGrams, grossRial, deductionsRial, shippingRial, valueRial]
      properties:
        input: { $ref: '#/components/schemas/CalculatorInput' }
        price: { $ref: '#/components/schemas/CalculatorPrice' }
        netWeightGrams: { type: integer, format: int64 }
        grossRial: { type: integer, format: int64 }
        deductionsRial: { type: integer, format: int64 }
        shippingRial: { type: integer, format: int64 }
        valueRial: { type: integer, format: int64 }

    SavedCalculation:
      type: object
      required: [id, name, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        result: { $ref: '#/components/schemas/CalculatorResult' }
        createdAt: { type: string, format: date-time }

    PriceAlertKind:
      type: string
      enum: [above, below, move]

    PriceAlertInput:
      type: object
      required: [series, kind]
      properties:
        series: { type: string }
        kind: { $ref: '#/components/schemas/PriceAlertKind' }
        threshold: { type: string, description: 'above / below: price in the series minor unit (IRR: Rial per kg, USD: cents per ton)' }
        moveBp: { type: integer, description: 'move: daily change in basis points (50–5000)' }

    PriceAlert:
      type: object
      required: [id, series, product, currency, unit, kind, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        product: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        unit: { $ref: '#/components/schemas/Unit' }
        kind: { $ref: '#/components/schemas/PriceAlertKind' }
        threshold: { type: string }
        moveBp: { type: integer }
        active: { type: boolean }
        lastTriggeredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AdminOfferingInput:
      type: object
      required: [tradeDate, metal, productFa, producerFa, offeredKg, basePriceRial]
      properties:
        tradeDate: { type: string, format: date }
        metal: { type: string }
        productFa: { type: string, maxLength: 200 }
        productEn: { type: string, maxLength: 200 }
        producerFa: { type: string, maxLength: 200 }
        producerEn: { type: string, maxLength: 200 }
        offeredKg: { type: integer, format: int64 }
        basePriceRial: { type: integer, format: int64 }
        demandKg: { type: integer, format: int64 }
        tradedKg: { type: integer, format: int64 }
        clearingPriceRial: { type: integer, format: int64 }

    AdminOffering:
      allOf:
        - $ref: '#/components/schemas/AdminOfferingInput'
        - type: object
          required: [id, source, updatedAt]
          properties:
            id: { type: string, format: uuid }
            source: { type: string, enum: [manual, demo, api] }
            updatedAt: { type: string, format: date-time }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: INTERNAL }
        detail: { type: string }
        requestId: { type: string }
        feature: { type: string, description: 'FEATURE_LOCKED: the locked feature key' }
        requiredPlan: { $ref: '#/components/schemas/Tier' }

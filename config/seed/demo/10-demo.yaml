# Demo-only data for local development and client demos on staging. Never loaded in production.
version: 1
datasets:
  - name: feature_flags
    mode: upsert
    rows:
      - { key: locale.en,        enabled: true, rules: {}, owner: product, description: "Demo: English enabled" }
      - { key: payments.enabled, enabled: true, rules: {}, owner: product, description: "Demo: payments via the mock gateway" }

  - name: site_settings
    mode: upsert
    rows:
      - key: contact
        value: { phone: "۰۲۱-۰۰۰۰۰۰۰۰", email: "demo@alanfelez.ir", address_fa: "نشانی نمایشی", address_en: "Demo address", hours_fa: "شنبه تا چهارشنبه ۸ تا ۱۷", hours_en: "Sat–Wed 08:00–17:00" }

  # Demo price generator (provider "demo", internal/prices/source/demo): a random walk around these prices, with one year
  # of back-filled history on first start. Refused when PRICES_DEMO_ALLOWED=false (production). Prices are minor units:
  # Rial per kg for IRR series, US cents per ton for LME. They're illustrative, not market data.
  - name: sources
    rows:
      - slug: demo
        provider: demo
        name_fa: داده نمایشی
        name_en: Demo data
        fetch_interval_s: 15
        stale_after_s: 300
        config:
          step_bp: 25            # typical move per tick, basis points
          backfill_days: 365
          series:
            aluminum-ingot-ime: 2850000
            aluminum-soft-scrap-free: 1950000
            copper-red-free: 6400000
            copper-cable-free: 6900000
            brass-yellow-free: 4300000
            brass-scrap-free: 3700000
            zinc-ingot-ime: 2600000
            lead-ingot-ime: 1900000
            rebar-16-iron: 345000
            steel-sheet-4-iron: 410000
            cast-iron-scrap-free: 180000
            aluminum-lme: 260000
            copper-lme: 980000
            zinc-lme: 280000
            lead-lme: 200000

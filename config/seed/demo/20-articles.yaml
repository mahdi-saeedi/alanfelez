        title_fa: "رشد قیمت مس در بازارهای جهانی پس از انتشار آمار تولید چین"
        title_en: "Copper rises on global markets after China’s output data"
        summary_fa: "بازارهای جهانی فلز پایه به گزارش‌های تولید صنعتی چین واکنش مثبت نشان دادند و قیمت مس در بورس فلزات لندن افزایش یافت."
        summary_en: "Global base-metal markets reacted positively to China’s industrial output reports, and copper rose on the London Metal Exchange."
        body_fa: |
          <p>این یک خبر نمونه برای نمایش ساختار صفحه است. بازارهای جهانی فلز پایه در معاملات امروز به گزارش‌های تولید صنعتی چین واکنش نشان دادند و قیمت مس در بورس فلزات لندن (LME) روند افزایشی داشت.</p>

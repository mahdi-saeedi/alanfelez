          <ul>
          <li>انتظار افزایش تقاضای صنعتی</li>
          <li>کاهش موجودی انبارهای LME</li>
          <li>نوسانات شاخص دلار</li>
          </ul>
          <p>فعالان بازار داخلی این تغییرات را در کنار نرخ ارز و شرایط عرضه داخلی دنبال می‌کنند.</p>
        body_en: |
          <p>This is a demo news item to show the page layout. Global base-metal markets reacted today to China’s industrial output reports, and copper trended higher on the London Metal Exchange (LME).</p>
          <h2>Drivers</h2>
          <ul>
          <li>Expectations of stronger industrial demand</li>
          <li>Lower LME warehouse stocks</li>
          <li>Moves in the dollar index</li>
          </ul>
          <p>Domestic market players follow these changes alongside the exchange rate and local supply.</p>


# Plans and prices (SCOPE.md §6). Amounts in Rial: 1,000,000 Toman = 10,000,000 Rial.
# insert_missing: once live, prices are changed in the admin panel (versioned), not here.
version: 1
datasets:
  - name: plans
    rows:
      - { code: free,   name_fa: رایگان,  name_en: Free,   rank: 0, active: true }

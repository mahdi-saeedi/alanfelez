      - { plan_code: silver, period: year,    amount_rial: 102000000 }  # −15 %
      - { plan_code: gold,   period: month,   amount_rial: 20000000 }
      - { plan_code: gold,   period: quarter, amount_rial: 57000000 }   # −5 %
      - { plan_code: gold,   period: year,    amount_rial: 204000000 }  # −15 %

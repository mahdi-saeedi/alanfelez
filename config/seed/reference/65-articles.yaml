        title_fa: "انواع ضایعات مس و فرق آن‌ها: از مس کابلی قرمز تا مس آرمیچری"
        summary_fa: "ضایعات مس در بازار با نام‌های مختلفی خرید و فروش می‌شود و قیمت هر نوع به خلوص و تمیزی آن بستگی دارد. در این مقاله با رایج‌ترین انواع ضایعات مس و نکته‌های قیمت‌گذاری آن‌ها آشنا می‌شوید."
        body_fa: |
          <p>مس از گران‌ترین فلزهای بازار ضایعات است. تفاوت قیمت انواع ضایعات مس هم زیاد است. دو بار مس هم‌وزن، بسته به نوع و تمیزی، می‌توانند قیمت کاملاً متفاوتی داشته باشند. در این مقاله رایج‌ترین انواع ضایعات مس در بازار ایران را مرور می‌کنیم.</p>
          <figure><a href="/articles/copper-scrap-types/types.jpg"><img src="/articles/copper-scrap-types/types.jpg" alt="هفت نوع رایج ضایعات مس: کابلی قرمز، کابلی سیاه، مخابراتی، آرمیچری، لوله مسی، آسیابی و ذوبی" width="1200" height="675"></a><figcaption>هفت نوع رایج ضایعات مس</figcaption></figure>
          <h2>۱. مس کابلی قرمز</h2>
          <p>مس کابلی قرمز سیم مسی لخت و براق است که از کابل‌ها بیرون آمده: بدون روکش، بدون قلع و بدون اکسید شدن. این نوع معمولاً خالص‌ترین و گران‌ترین ضایعات مس است.</p>
          <h2>۲. مس کابلی سیاه</h2>
          <p>سیم مسی‌ای که سطحش تیره یا اکسید شده، مثلاً بر اثر سوزاندن روکش یا ماندن در هوا. چون اکسید و آلودگی دارد، معمولاً از مس کابلی قرمز ارزان‌تر است.</p>
          <blockquote><p>نکته: سوزاندن روکش کابل علاوه بر آلودگی هوا، کیفیت مس را هم پایین می‌آورد. جدا کردن روکش با دستگاه، مس را قرمز و براق نگه می‌دارد.</p></blockquote>
          <h2>۳. مس مخابراتی</h2>
          <p>سیم‌های نازک کابل‌های تلفن و مخابرات. این سیم‌ها گاهی قلع‌اندود یا لاک‌دار هستند و به خاطر نازکی، جدا کردنشان از روکش سخت‌تر است.</p>
          <h2>۴. مس آرمیچری</h2>
          <p>سیم‌پیچ موتورهای برقی، ترانسفورماتورها و دینام‌ها. این سیم‌ها روکش لاکی (لعاب) دارند که باید جدا شود. قیمتش معمولاً پایین‌تر از مس کابلی است.</p>
          <h2>۵. لوله مسی</h2>
          <p>لوله‌های مسی کولر، یخچال، پکیج و تأسیسات. اگر لحیم، اتصال برنجی یا عایق به لوله چسبیده باشد، از قیمتش کم می‌شود.</p>
          <h2>۶. مس آسیابی</h2>
          <p>مس ریزی که از خرد کردن (گرانول کردن) کابل و جدا کردن روکش به دست می‌آید. اگر تمیز باشد، خلوص بالایی دارد.</p>
          <h2>۷. مس ذوبی</h2>
          <p>مسی که یک بار ذوب شده و به شکل شمش یا تکه‌های ریختگی درآمده. خلوص آن به مواد اولیه‌ی ذوب بستگی دارد. برای همین قیمتش از باری به بار دیگر فرق می‌کند.</p>
          <h2>چه چیزهایی قیمت ضایعات مس را تعیین می‌کند؟</h2>
          <figure><a href="/articles/copper-scrap-types/price-factors.jpg"><img src="/articles/copper-scrap-types/price-factors.jpg" alt="پنج عامل قیمت ضایعات مس: خلوص، روکش و لاک، اکسید و سوختگی، مواد چسبیده، قیمت جهانی و نرخ ارز" width="1200" height="675"></a></figure>
          <ul><li><strong>خلوص:</strong> هر چه مس خالص‌تر باشد، قیمت به قیمت مس خالص نزدیک‌تر است.</li><li><strong>روکش، لاک و قلع:</strong> هر پوششی که باید جدا شود از قیمت کم می‌کند.</li><li><strong>اکسید و سوختگی:</strong> مس براق ارزش بیشتری از مس تیره دارد.</li><li><strong>مواد چسبیده:</strong> برنج، آهن، لحیم و پلاستیک باید جدا شوند.</li><li><strong>قیمت جهانی و نرخ ارز:</strong> قیمت ضایعات مس در ایران همراه با قیمت جهانی مس و نرخ دلار بالا و پایین می‌رود.</li></ul>
          <h2>جمع‌بندی</h2>
          <p>اگر ضایعات مس را بر اساس نوع جدا کنید، روکش‌ها را بدون سوزاندن بردارید و بار را از مواد خارجی پاک کنید، معامله‌ی بهتری خواهید داشت.</p>
          <p>قیمت روز انواع ضایعات مس، کاتد مس و قیمت جهانی مس را در صفحه‌ی <a href="/prices/copper">قیمت مس امروز</a> ببینید.</p>
          <blockquote><p>قیمت‌ها و توضیحات این مقاله برای آشنایی است. قیمت هر بار به کیفیت، مقدار و شرایط معامله بستگی دارد.</p></blockquote>

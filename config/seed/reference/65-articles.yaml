        cover_url: /articles/soft-vs-hard-aluminum-scrap/cover.jpg
        keywords_fa: "آلومینیوم نرم، آلومینیوم خشک، ضایعات آلومینیوم، قیمت ضایعات آلومینیوم، قوطی رانی، پروفیل آلومینیوم"
        title_fa: "فرق آلومینیوم نرم و خشک چیست؟ راهنمای شناخت ضایعات آلومینیوم"
        summary_fa: "ضایعات آلومینیوم در بازار به دو دسته‌ی اصلی «نرم» و «خشک» تقسیم می‌شود که قیمت متفاوتی دارند. در این مقاله می‌خوانید هر کدام چیست، از کجا می‌آید و چطور آن‌ها را از هم تشخیص دهید."
        body_fa: |
          <p>ضایعات آلومینیوم یکی از پرمعامله‌ترین ضایعات فلزی بازار ایران است. کسی که برای اولین بار بار آلومینیوم می‌خرد یا می‌فروشد، خیلی زود با دو اصطلاح روبه‌رو می‌شود: <strong>آلومینیوم نرم</strong> و <strong>آلومینیوم خشک</strong>. این دو دسته در قیمت، کاربرد و روش ذوب با هم فرق دارند. اگر آن‌ها را از هم نشناسید، ممکن است باری را با قیمت اشتباه معامله کنید.</p>
          <h2>آلومینیوم نرم چیست؟</h2>
          <p>آلومینیوم نرم از قطعاتی به دست می‌آید که با نورد، اکستروژن (کشش) یا کشیدن شکل گرفته‌اند. این قطعات معمولاً از آلیاژهایی با مقدار کمی عناصر دیگر ساخته شده‌اند و خلوص آلومینیوم در آن‌ها بالاتر است. نمونه‌های رایج:</p>
          <ul><li>پروفیل شاخه (در و پنجره و نما)</li><li>قوطی رانی و قوطی نوشابه</li><li>ورق، فویل و ظروف آلومینیومی</li><li>سیم و کابل آلومینیومی</li><li>رادیاتورهای آلومینیومی</li></ul>
          <p>آلومینیوم نرم خم می‌شود و چکش‌خوار است. با ذوب دوباره می‌شود از آن محصولی با کیفیت نزدیک به محصول اولیه ساخت. به همین دلیل معمولاً قیمت بالاتری از آلومینیوم خشک دارد.</p>
          <h2>آلومینیوم خشک چیست؟</h2>
          <p>آلومینیوم خشک از قطعات ریخته‌گری به دست می‌آید. این قطعات را با ریختن مذاب در قالب ساخته‌اند. آلیاژهای ریخته‌گری سیلیسیم و گاهی مس بیشتری دارند تا مذاب راحت‌تر در قالب جاری شود. نمونه‌های رایج:</p>
          <ul><li>پیستون</li><li>سرسیلندر و بلوک موتور</li><li>رینگ خودرو</li><li>گیربکس و قطعات ریختگی خودرو و موتورسیکلت</li></ul>
          <p>آلومینیوم خشک سخت و ترد است. به‌جای خم شدن، می‌شکند. معمولاً برای ساخت دوباره‌ی قطعات ریختگی مصرف می‌شود و قیمتش از آلومینیوم نرم پایین‌تر است.</p>
          <figure><a href="/articles/soft-vs-hard-aluminum-scrap/compare.jpg"><img src="/articles/soft-vs-hard-aluminum-scrap/compare.jpg" alt="جدول مقایسه‌ی آلومینیوم نرم و خشک: ساخت قطعه، نمونه‌ها، آزمون خم کردن، سطح شکست و قیمت" width="1200" height="675"></a><figcaption>آلومینیوم نرم و خشک در یک نگاه</figcaption></figure>
          <h2>چطور نرم و خشک را از هم تشخیص دهیم؟</h2>
          <ul><li><strong>آزمون خم کردن:</strong> تکه‌ی نازکی را خم کنید. آلومینیوم نرم خم می‌شود و آلومینیوم خشک ترک برمی‌دارد یا می‌شکند.</li><li><strong>سطح شکست:</strong> شکستگی آلومینیوم خشک معمولاً دانه‌دانه و مات است.</li><li><strong>منشأ قطعه:</strong> اگر قطعه ریختگی است (پیستون، سرسیلندر، رینگ)، تقریباً همیشه خشک است. اگر نوردی یا کششی است (پروفیل، ورق، قوطی)، نرم است.</li><li><strong>صدا:</strong> با ضربه، آلومینیوم خشک صدای خشک‌تر و کوتاه‌تری می‌دهد. این روش به تجربه نیاز دارد.</li></ul>
          <h2>چه چیزهایی قیمت بار آلومینیوم را پایین می‌آورد؟</h2>
          <figure><a href="/articles/soft-vs-hard-aluminum-scrap/price-factors.jpg"><img src="/articles/soft-vs-hard-aluminum-scrap/price-factors.jpg" alt="چهار عامل کاهش قیمت بار آلومینیوم: مخلوط بودن، رطوبت، روغن و گل، مواد خارجی" width="1200" height="675"></a></figure>
          <ul><li><strong>مخلوط بودن نرم و خشک:</strong> بار درهم معمولاً با قیمت دسته‌ی ارزان‌تر حساب می‌شود. جدا کردن این دو، ارزش بار را بالا می‌برد.</li><li><strong>رطوبت:</strong> در ضایعات آلومینیوم، مخصوصاً سفاله (براده‌ی تراشکاری) و قوطی، آب و رطوبت وزن را بالا می‌برد و خریدار آن را کسر می‌کند.</li><li><strong>روغن و آلودگی:</strong> سفاله‌ی روغنی و بار گل‌آلود بازده ذوب را کم می‌کند.</li><li><strong>مواد خارجی:</strong> آهن، پیچ، پلاستیک، لاستیک و رنگ چسبیده به قطعه از وزن مفید کم می‌کند.</li></ul>
          <h2>جمع‌بندی</h2>
          <p>آلومینیوم نرم از قطعات نوردی و کششی به دست می‌آید، خم می‌شود و معمولاً گران‌تر است. آلومینیوم خشک از قطعات ریختگی به دست می‌آید، می‌شکند و ارزان‌تر است. اگر بار را جدا، خشک و تمیز نگه دارید، بهترین قیمت را می‌گیرید.</p>
          <p>قیمت روز ضایعات آلومینیوم نرم و خشک، شمش آلومینیوم و قیمت جهانی آلومینیوم را در صفحه‌ی <a href="/prices/aluminum">قیمت آلومینیوم امروز</a> ببینید.</p>
          <blockquote><p>قیمت‌ها و توضیحات این مقاله برای آشنایی است. قیمت هر بار به کیفیت، مقدار و شرایط معامله بستگی دارد.</p></blockquote>

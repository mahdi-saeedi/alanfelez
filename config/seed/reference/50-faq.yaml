        published: true
        question_fa: "اگر رمز عبورم را فراموش کنم چه کار کنم؟"
        answer_fa: "<p>در صفحه ورود، گزینه «فراموشی رمز عبور» را انتخاب کنید و اطلاعات مورد نیاز را وارد کنید. مراحل بازیابی حساب از طریق روش ارتباطی ثبت‌شده برای شما ارسال خواهد شد.</p>"
        question_en: "What if I forget my password?"
        answer_en: "<p>On the login page choose “Forgot password” and enter the requested details. The account recovery steps will be sent to the contact method registered for you.</p>"
      - slug: edit-account  # FAQ.docx #45

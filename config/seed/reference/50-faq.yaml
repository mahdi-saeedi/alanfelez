        answer_fa: "<p>برای مشاهده برخی اطلاعات عمومی نیازی به ثبت‌نام نیست؛ اما استفاده از امکانات اختصاصی، خرید اشتراک و برخی خدمات دیگر نیازمند ایجاد حساب کاربری است.</p>"
        question_en: "Do I need to sign up to use Alan Felez?"
        answer_en: "<p>You don’t need to sign up to see some general information, but using exclusive features, buying a subscription and some other services require an account.</p>"
      - slug: forgot-password  # FAQ.docx #44
        category: account
        sort: 20

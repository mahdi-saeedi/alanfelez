        question_fa: "سرویس پیامک الان‌فلز چیست؟"
        answer_fa: "<p>این سرویس به کاربران اجازه می‌دهد اطلاعات منتخب بازار مانند قیمت یک کالای مشخص یا هشدارهای مربوط به تغییرات قابل توجه قیمت را از طریق پیامک دریافت کنند.</p>"
        question_en: "What is the Alan Felez SMS service?"
        answer_en: "<p>It lets users receive selected market information by SMS, such as the price of a specific product or alerts about significant price changes.</p>"

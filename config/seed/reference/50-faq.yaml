        question_fa: "آیا دریافت پیامک هزینه جداگانه دارد؟"
        answer_fa: "<p>هزینه و شرایط استفاده از سرویس پیامک مطابق بسته خدماتی و نوع اشتراک کاربر در صفحه اشتراک‌ها اعلام می‌شود.</p>"
        question_en: "Does the SMS service cost extra?"
        answer_en: "<p>The cost and terms of the SMS service are shown on the subscriptions page, according to the service package and your plan.</p>"
      - slug: do-i-need-to-sign-up  # FAQ.docx #42

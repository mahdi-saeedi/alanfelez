        question_fa: "هشدار تغییر شدید قیمت چگونه کار می‌کند؟"
        answer_fa: "<p>در صورت عبور تغییرات قیمت از محدوده تعریف‌شده، سیستم می‌تواند هشدار مربوطه را برای کاربرانی که این سرویس را فعال کرده‌اند ارسال کند.</p>"
        question_en: "How do sharp price-change alerts work?"
        answer_en: "<p>When a price moves beyond a set range, the system can send an alert to users who have turned this service on.</p>"
      - slug: sms-cost  # FAQ.docx #41

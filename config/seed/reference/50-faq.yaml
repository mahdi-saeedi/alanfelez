        answer_fa: "<p>بله. اطلاعات قابل ویرایش حساب کاربری از طریق بخش «پروفایل» یا «حساب کاربری» قابل تغییر است.</p>"
        question_en: "Can I change my account details?"
        answer_en: "<p>Yes. Editable account details can be changed in the profile or account section.</p>"
      - slug: personal-data  # FAQ.docx #46
        category: account
        sort: 40
        popular: false
        published: true
        question_fa: "آیا اطلاعات شخصی کاربران محفوظ می‌ماند؟"
        answer_fa: "<p>الان‌فلز اطلاعات کاربران را مطابق قوانین و سیاست حفظ حریم خصوصی خود نگهداری و در چارچوب خدمات سایت استفاده می‌کند. اطلاعات کاربران بدون مجوز قانونی یا رضایت لازم در اختیار اشخاص غیرمجاز قرار نخواهد گرفت.</p>"
        question_en: "Is my personal information kept safe?"
        answer_en: "<p>Alan Felez keeps user information in line with the law and its privacy policy and uses it within the site’s services. User information is not shared with unauthorised parties without a legal basis or the required consent.</p>"
      - slug: licenses-and-trust  # FAQ.docx #47
        category: trust
        sort: 10
        popular: false
        published: false
        question_fa: "آیا الان‌فلز دارای مجوز و نماد اعتماد است؟"
        answer_fa: "<p>مجوزها، نمادهای اعتماد و گواهی‌های رسمی الان‌فلز در بخش «مجوزها و اعتبار» سایت قابل مشاهده خواهند بود. اطلاعات هر مجوز شامل عنوان، مرجع صادرکننده و وضعیت اعتبار آن نمایش داده می‌شود.</p>"
        question_en: "Does Alan Felez hold licences and trust seals?"
        answer_en: "<p>Alan Felez’s licences, trust seals and official certificates will be shown in the site’s “Licences & trust” section, with the title, issuing authority and validity of each.</p>"
      - slug: payment-security  # FAQ.docx #48
        category: trust
        sort: 20
        popular: false
        published: true
        question_fa: "آیا پرداخت در الان‌فلز امن است؟"
        answer_fa: "<p>پرداخت‌های آنلاین از طریق درگاه‌های پرداخت معتبر انجام می‌شوند. کاربران هنگام پرداخت باید تنها از درگاه رسمی و آدرس معتبر سایت استفاده کنند و اطلاعات بانکی خود را در اختیار اشخاص دیگر قرار ندهند.</p>"
        question_en: "Are payments on Alan Felez secure?"
        answer_en: "<p>Online payments go through reputable payment gateways. When paying, only use the official gateway and the site’s genuine address, and never share your bank details with anyone.</p>"
      - slug: contact-support  # FAQ.docx #50
        category: trust
        sort: 30
        popular: true
        published: true
        question_fa: "چگونه با پشتیبانی الان‌فلز تماس بگیرم؟"
        answer_fa: "<p>کاربران می‌توانند از طریق بخش «تماس با ما» و روش‌های ارتباطی اعلام‌شده در سایت، مانند تلفن، ایمیل، پیام‌رسان یا تیکت پشتیبانی با تیم الان‌فلز در ارتباط باشند.</p>"
        question_en: "How do I contact Alan Felez support?"
        answer_en: "<p>You can reach the Alan Felez team through the “Contact us” section and the contact methods listed on the site, such as phone, e-mail, messengers or a support ticket.</p>"
